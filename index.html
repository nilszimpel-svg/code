<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Z</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --glow: rgba(120, 140, 255, 0.18);
      --face-a: #f4f5ff;
      --face-b: #9aa6ff;
      --side-a: #4b55c9;
      --side-b: #1c2063;
      --size: min(52vmin, 420px);
      --depth: 26; /* number of extrusion layers */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background:
        radial-gradient(circle at 50% 45%, var(--glow), transparent 60%),
        var(--bg);
      display: grid;
      place-items: center;
      overflow: hidden;
      perspective: 1200px;
      cursor: default;
    }

    .stage {
      width: var(--size);
      height: var(--size);
      transform-style: preserve-3d;
      animation: float 6s ease-in-out infinite;
    }

    .logo {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transform: rotateX(var(--rx, 12deg)) rotateY(var(--ry, -24deg));
      transition: transform 0.25s ease-out;
    }

    .layer {
      position: absolute;
      inset: 0;
      clip-path: polygon(
        10% 10%, 90% 10%, 90% 27%,
        37% 73%, 90% 73%, 90% 90%,
        10% 90%, 10% 73%, 63% 27%,
        10% 27%
      );
      background: linear-gradient(135deg, var(--side-a), var(--side-b));
      transform: translateZ(calc(var(--i) * -2px));
    }

    .layer.front {
      background: linear-gradient(135deg, var(--face-a) 0%, var(--face-b) 100%);
      transform: translateZ(1px);
    }

    .shadow {
      position: absolute;
      left: 50%;
      bottom: 12vh;
      width: calc(var(--size) * 0.8);
      height: calc(var(--size) * 0.08);
      translate: -50% 0;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(0, 0, 0, 0.7), transparent);
      animation: shadow 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(-1.5vmin); }
      50%      { transform: translateY(1.5vmin); }
    }

    @keyframes shadow {
      0%, 100% { scale: 0.85; opacity: 0.6; }
      50%      { scale: 1;    opacity: 0.9; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage, .shadow { animation: none; }
    }
  </style>
</head>
<body>
  <div class="stage" aria-label="Z Logo" role="img">
    <div class="logo" id="logo"></div>
  </div>
  <div class="shadow" aria-hidden="true"></div>

  <script>
    const logo = document.getElementById('logo');
    const depth = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--depth'), 10);

    // Extrude the Z by stacking layers from back to front.
    for (let i = depth; i >= 1; i--) {
      const layer = document.createElement('div');
      layer.className = 'layer';
      layer.style.setProperty('--i', i);
      logo.appendChild(layer);
    }
    const front = document.createElement('div');
    front.className = 'layer front';
    logo.appendChild(front);

    // Tilt towards the pointer; idle rotation when untouched.
    let pointerActive = false;
    let idleTimer;

    function tilt(x, y) {
      logo.style.setProperty('--ry', `${x * 40}deg`);
      logo.style.setProperty('--rx', `${-y * 30}deg`);
    }

    window.addEventListener('pointermove', (e) => {
      pointerActive = true;
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => (pointerActive = false), 2500);
      tilt(e.clientX / innerWidth - 0.5, e.clientY / innerHeight - 0.5);
    });

    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const start = performance.now();
    (function idle(now) {
      if (!pointerActive && !reduceMotion) {
        const t = (now - start) / 1000;
        tilt(Math.sin(t * 0.6) * 0.6, Math.sin(t * 0.4) * 0.3 - 0.3);
      }
      requestAnimationFrame(idle);
    })(start);
  </script>
</body>
</html>
